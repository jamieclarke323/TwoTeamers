{% extends "base.html" %}
{% block title %}Profile | Two Teamers{% endblock %}
{% block content %}
<section class="auth-shell"><div class="auth-panel">
  <a class="back-link" href="{{ url_for('main.home') }}">Back</a>
  <p class="eyebrow">Your account</p>
  <h1>Profile</h1>
  <p class="profile-email">{{ g.user.email }}</p>
  <form class="auth-form" method="post">
    <label>Which team do you support?
      <select name="supported_team" required>
      {% for team in team_choices %}<option value="{{ team }}" {{ 'selected' if team == g.user.supported_team }}>{{ team }}</option>{% endfor %}
      </select>
    </label>
    <button class="button" type="submit">Update team</button>
  </form>
</div></section>
{% endblock %}
