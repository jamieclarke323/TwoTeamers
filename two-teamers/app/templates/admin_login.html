{% extends "base.html" %}
{% block title %}Admin access | Two Teamers{% endblock %}
{% block content %}
<section class="page-head">
  <h1>Admin access</h1>
  <p>Enter the admin password to continue.</p>
  {% if error %}<p role="alert" class="feedback wrong">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="admin-password">Password</label>
    <input id="admin-password" type="password" name="password" autocomplete="current-password" required>
    <button class="button" type="submit">Unlock admin</button>
  </form>
</section>
{% endblock %}
